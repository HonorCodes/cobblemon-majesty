modLoader="kotlinforforge"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/cobblemon_majesty/icon.png"
logoBlur=false
authors="${mod_authors}"
description='''
Majestic Cobblemon variants with dual-strand elemental type auras, Majesty Orb awakening, custom sparkle SFX, and Showdown STAB mastery.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    type="required"
    versionRange="${loader_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="cobblemon"
    type="required"
    versionRange="${cobblemon_version_range}"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
config="cobblemon_majesty.mixins.json"
